services:
  - type: web
    name: autopredict-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: BASE_URL
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /health
