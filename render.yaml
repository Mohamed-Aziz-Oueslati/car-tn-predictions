services:
  - type: web
    name: autopredict-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false # set manually in Render dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: BASE_URL
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /health
