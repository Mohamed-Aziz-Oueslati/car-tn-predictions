app = "car-tn-predictions"
primary_region = "iad"

[build]
  [build.args]
    PYTHON_VERSION = "3.11.9"

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256