name: Monthly Model Retraining

on:
  # Run on the 1st of every month at 03:00 UTC
  schedule:
    - cron: "0 3 1 * *"
  # Also allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Firefox & GeckoDriver
        uses: browser-actions/setup-firefox@v1
      - uses: browser-actions/setup-geckodriver@latest

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── Step 1: Run all scrapers ──────────────────────────────────
      - name: Run scrapers
        run: |
          python automobile_tn_scraper.py
          python baniola_scraper.py
          python cava_scraper.py
          python vente_voiture_tunisie_scraper.py

      # ── Step 2: Impute missing values ─────────────────────────────
      - name: Run imputer
        run: |
          python imputer.py

      # ── Step 3: Retrain the model ─────────────────────────────────
      - name: Run training
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python main.py

      - name: Commit and push updated data & model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.csv best_model.pkl
          # Only commit if there are staged changes
          if git diff --cached --quiet; then
            echo "No changes, skipping commit."
          else
            git commit -m "chore: scrape, impute & retrain $(date +'%Y-%m-%d')"
            git push
          fi
